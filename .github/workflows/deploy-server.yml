name: Deploy to Own Server

# 把 H5 + FastAPI 后端部署到自己的服务器（Docker + Nginx）。
# 推送到 main 自动部署，也可以在 Actions 页面手动触发。
# 需要在仓库 Secrets 中配置：
#   SERVER_HOST   服务器 IP 或域名
#   SERVER_USER   SSH 用户名
#   SERVER_SSH_KEY 私钥内容
#   DEPLOY_PATH   服务器部署目录（可选，默认 /data/myproject）

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 部署是串行的：新提交排队等待上一次部署完成，避免两个部署同时操作容器
concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build H5
        working-directory: frontend
        env:
          # 自有服务器由 Nginx 托管在根路径
          UNI_H5_BASE: /
          # 服务器版使用 MySQL + 账号登录
          VITE_DATA_MODE: remote
        run: npm run build:h5

      - name: Build admin panel
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Merge admin into H5
        run: |
          mkdir -p frontend/dist/build/h5/admin
          cp -R admin/dist/. frontend/dist/build/h5/admin/
          ls -lh frontend/dist/build/h5/admin | head

      - name: Verify H5 build
        run: |
          test -f frontend/dist/build/h5/index.html
          test -f frontend/dist/build/h5/admin/index.html
          echo "H5 + admin build OK"

      - name: Setup SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Package artifacts
        run: |
          tar --exclude='.env' --exclude='*.db' --exclude='*.zip' --exclude='.venv' \
              -czf /tmp/backend.tar.gz -C backend .
          tar -czf /tmp/h5.tar.gz -C frontend/dist/build/h5 .
          tar -czf /tmp/infra.tar.gz docker-compose.yml nginx/
          echo "Package sizes:"
          ls -lh /tmp/backend.tar.gz /tmp/h5.tar.gz /tmp/infra.tar.gz

      - name: Upload to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp /tmp/backend.tar.gz  "$SERVER_USER@$SERVER_HOST:/tmp/tongban-backend.tar.gz"
          scp /tmp/h5.tar.gz      "$SERVER_USER@$SERVER_HOST:/tmp/tongban-h5.tar.gz"
          scp /tmp/infra.tar.gz   "$SERVER_USER@$SERVER_HOST:/tmp/tongban-infra.tar.gz"
          echo "Upload done"

      # 如果配置了 DASHSCOPE_API_KEY secret，就把它同步到服务器的 .env，
      # 让后端启用通义千问出题；未配置则保持原样（前端会回退本地题库）。
      - name: Sync AI key to server
        env:
          AI_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$AI_KEY" ]; then
            echo "DASHSCOPE_API_KEY secret 未配置，跳过（AI 出题会回退本地题库）"
            exit 0
          fi
          printf 'DASHSCOPE_API_KEY=%s\n' "$AI_KEY" > /tmp/tongban-ai.env
          scp /tmp/tongban-ai.env "$SERVER_USER@$SERVER_HOST:/tmp/tongban-ai.env"
          ssh "$SERVER_USER@$SERVER_HOST" "DEPLOY='${DEPLOY_PATH:-/data/myproject}'; mkdir -p \"\$DEPLOY\"; touch \"\$DEPLOY/.env\"; cp -a \"\$DEPLOY/.env\" \"\$DEPLOY/.env.bak\" 2>/dev/null || true; sed -i '/^DASHSCOPE_API_KEY=/d' \"\$DEPLOY/.env\"; cat /tmp/tongban-ai.env >> \"\$DEPLOY/.env\"; chmod 600 \"\$DEPLOY/.env\"; rm -f /tmp/tongban-ai.env; grep -q '^MYSQL_PASSWORD=.\+' \"\$DEPLOY/.env\" || echo 'WARN: .env 缺少 MYSQL_PASSWORD'; echo '.env 已更新 AI Key'"
          rm -f /tmp/tongban-ai.env

      - name: Deploy on server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 用引号括住 heredoc 结束符，防止本地 shell 展开 $变量
          ssh "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'ENDSSH'
          set -e

          DEPLOY="${DEPLOY_PATH:-/data/myproject}"
          echo ">>> Target: $DEPLOY"

          # 确保 docker compose 可用（兼容 v1 和 v2）
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose"
          else
            DC="docker-compose"
          fi
          echo ">>> Using: $DC"

          mkdir -p "$DEPLOY/backend" "$DEPLOY/frontend/site" "$DEPLOY/nginx"
          cd "$DEPLOY"

          # 1. 基础设施（docker-compose + nginx）
          echo ">>> Extracting infra..."
          tar -xzf /tmp/tongban-infra.tar.gz
          ls -la docker-compose.yml nginx/nginx.conf

          # 1.5 自动创建 .env 占位（如果不存在）
          if [ ! -f .env ]; then
            echo ">>> Creating empty .env placeholder..."
            printf '%s\n' \
              '# === 通义千问 (DashScope) 配置 ===' \
              '# 免费申请：https://bailian.console.aliyun.com/' \
              'DASHSCOPE_API_KEY=' \
              'QWEN_MODEL=qwen-turbo' \
              > .env
          else
            echo ">>> .env already exists, keeping it"
          fi

          # 1.6 校验/生成 MySQL 与 JWT 配置（已有值绝不覆盖）
          gen_secret() {
            if command -v openssl >/dev/null 2>&1; then
              openssl rand -hex "$1"
            else
              head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'
            fi
          }
          volume_exists=0
          if docker volume inspect myproject_tongban-mysql >/dev/null 2>&1; then
            volume_exists=1
          fi
          ensure_env() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" .env 2>/dev/null; then
              if ! grep -qE "^${key}=.+" .env 2>/dev/null; then
                echo "❌ .env 中 $key 为空；为避免数据库密码错乱，部署中止"
                exit 1
              fi
              return 0
            fi
            if [ "$volume_exists" = "1" ]; then
              case "$key" in
                MYSQL_*)
                  echo "❌ 检测到已有 MySQL 数据卷，但 .env 缺少 $key；为避免数据丢失，部署中止"
                  exit 1
                  ;;
              esac
            fi
            printf '%s=%s\n' "$key" "$value" >> .env
            echo "  + generated $key"
          }
          ensure_env MYSQL_DATABASE "tongban"
          ensure_env MYSQL_USER "tongban"
          ensure_env MYSQL_PASSWORD "$(gen_secret 16)"
          ensure_env MYSQL_ROOT_PASSWORD "$(gen_secret 16)"
          ensure_env JWT_SECRET "$(gen_secret 32)"
          ensure_env ADMIN_USERNAME "admin"
          ensure_env ADMIN_PASSWORD "$(gen_secret 12)"
          ensure_env PIP_INDEX_URL "https://mirrors.aliyun.com/pypi/simple/"
          chmod 600 .env

          set -a
          . ./.env
          set +a

          # 1.7 已有 MySQL 容器时，密码必须与 .env 一致，否则拒绝重建
          if docker inspect tongban-mysql >/dev/null 2>&1; then
            cur_pw=$(docker inspect tongban-mysql --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MYSQL_PASSWORD=//p')
            cur_root=$(docker inspect tongban-mysql --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MYSQL_ROOT_PASSWORD=//p')
            if [ -n "$cur_pw" ] && { [ "$cur_pw" != "$MYSQL_PASSWORD" ] || [ "$cur_root" != "$MYSQL_ROOT_PASSWORD" ]; }; then
              echo "❌ 现有 MySQL 容器密码与 .env 不一致，拒绝重建（请先统一密码并备份数据）"
              exit 1
            fi
          fi

          # 2. 后端代码（保留数据库和 .env）
          echo ">>> Extracting backend..."
          tar -xzf /tmp/tongban-backend.tar.gz -C backend

          # 3. 先拉镜像 / 构建，旧站保持运行
          echo ">>> Pulling MySQL image..."
          timeout 300 $DC pull mysql || { echo "❌ MySQL 镜像拉取失败（旧站保持运行）"; exit 1; }
          echo ">>> Building backend image..."
          timeout 600 $DC build --build-arg CACHEBUST=${{ github.sha }} backend || { echo "❌ 后端镜像构建失败（旧站保持运行）"; exit 1; }

          # 4. 启动 MySQL 并等待健康（不停止旧站）
          echo ">>> Starting MySQL..."
          $DC up -d --no-recreate mysql
          echo ">>> Waiting for MySQL..."
          mysql_ready=0
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tongban-mysql 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then
              mysql_ready=1
              echo "✅ MySQL healthy"
              break
            fi
            echo "  waiting for MySQL... ($i/60) $status"
            sleep 2
          done
          if [ "$mysql_ready" != "1" ]; then
            echo "❌ MySQL 未就绪，旧站保持运行"
            $DC logs --tail=50 mysql
            exit 1
          fi

          # 4.5 校验应用账号能否登录（密码与数据卷不一致时立即中止）
          # 注意：exec -T 会读取 stdin，必须重定向，否则会吞掉后面的部署脚本
          if ! $DC exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "SELECT 1" </dev/null >/dev/null 2>&1; then
            echo "❌ 应用数据库账号无法登录（.env 与数据卷密码不一致），已中止，旧站保持运行"
            exit 1
          fi

          # 5. H5 前端（MySQL 就绪后再替换静态文件）
          echo ">>> Extracting H5..."
          find frontend/site -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf /tmp/tongban-h5.tar.gz -C frontend/site

          # 6. 滚动替换后端与 Nginx（不 down 整个栈，MySQL 不重启）
          echo ">>> Replacing backend..."
          $DC up -d --no-deps backend
          echo ">>> Restarting nginx..."
          $DC restart nginx

          echo ""
          echo "=== Container Status ==="
          $DC ps

          # 6. 健康检查（MySQL 首次初始化可能较慢，后端统一通过 nginx 验证）
          echo ""
          echo "=== Health Checks ==="
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1/api/health >/dev/null 2>&1; then
              echo "✅ nginx proxy -> backend OK"
              break
            fi
            echo "  waiting for backend... ($i/40)"
            sleep 2
          done
          curl -sf http://127.0.0.1/api/health >/dev/null 2>&1 || {
            echo "❌ backend API FAILED - logs:"
            $DC logs --tail=50 backend
            $DC logs --tail=30 mysql
            exit 1
          }

          # 防止复用旧镜像导致新接口 404
          docker exec tongban-backend test -f /app/curriculum.py || {
            echo "❌ backend image is stale (curriculum.py missing)"
            $DC logs --tail=30 backend
            exit 1
          }

          if curl -sf http://127.0.0.1/ >/dev/null 2>&1; then
            echo "✅ nginx H5 OK"
          else
            echo "❌ nginx H5 FAILED"
            $DC logs --tail=30 nginx
            exit 1
          fi

          # 7. 清理
          rm -f /tmp/tongban-backend.tar.gz /tmp/tongban-h5.tar.gz /tmp/tongban-infra.tar.gz

          echo ""
          echo "🎉 部署成功！"
          ENDSSH
