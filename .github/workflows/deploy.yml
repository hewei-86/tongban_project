name: Deploy to GitHub Pages

# 推送到 main 分支即自动构建并发布到 GitHub Pages。
# 首次使用请在仓库 Settings → Pages → Source 选择 "GitHub Actions"。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库首次部署时自动把 Pages 的 Source 设为 GitHub Actions
          enablement: true

      # GitHub Pages 项目站点部署在 /<仓库名>/ 子路径下，
      # 通过 UNI_H5_BASE 告诉 uni-app 资源和路由的 base；
      # 如果仓库名是 <owner>.github.io，则部署在根路径 /。
      - name: Resolve H5 base path
        id: base
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          if [ "${repo,,}" = "${owner,,}.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${repo}/" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Build H5
        working-directory: frontend
        env:
          UNI_H5_BASE: ${{ steps.base.outputs.value }}
        run: npm run build:h5

      - name: Prepare static files
        run: |
          test -f frontend/dist/build/h5/index.html
          # .nojekyll 让 GitHub Pages 不做 Jekyll 处理，下划线开头的文件也能正常访问
          touch frontend/dist/build/h5/.nojekyll
          # 兜底：路径型 404 也返回应用入口
          cp frontend/dist/build/h5/index.html frontend/dist/build/h5/404.html
          echo "H5 build OK"
          ls -lh frontend/dist/build/h5 | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/build/h5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
