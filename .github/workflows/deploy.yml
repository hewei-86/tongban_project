
name: Tongban Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build H5
        working-directory: frontend
        run: npx uni build -p h5

      - name: Check H5 build output
        run: |
          test -f frontend/dist/build/h5/index.html
          echo "H5 build OK: $(ls -la frontend/dist/build/h5/ | wc -l) files"

      - name: Setup SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Package all files
        run: |
          tar --exclude='.env' \
              --exclude='*.db' \
              --exclude='*.zip' \
              --exclude='.venv' \
              -czf /tmp/backend.tar.gz -C backend .

          tar -czf /tmp/h5.tar.gz -C frontend/dist/build/h5 .

          tar -czf /tmp/infra.tar.gz docker-compose.yml nginx/

      - name: Upload to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp /tmp/backend.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/tongban-backend.tar.gz"
          scp /tmp/h5.tar.gz     "$SERVER_USER@$SERVER_HOST:/tmp/tongban-h5.tar.gz"
          scp /tmp/infra.tar.gz  "$SERVER_USER@$SERVER_HOST:/tmp/tongban-infra.tar.gz"

      - name: Deploy on server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/data/myproject' }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" 'bash -s' <<REMOTE
          set -e
          DEPLOY="${DEPLOY_PATH}"
          echo ">>> Deploying to \$DEPLOY"
          mkdir -p "\$DEPLOY/backend" "\$DEPLOY/frontend/site" "\$DEPLOY/nginx"
          cd "\$DEPLOY"

          # 1. 更新基础设施文件（docker-compose + nginx.conf）
          tar -xzf /tmp/tongban-infra.tar.gz
          echo ">>> infra OK"

          # 2. 更新后端代码（保留 .env 和 tongban.db）
          tar -xzf /tmp/tongban-backend.tar.gz -C backend
          echo ">>> backend OK"

          # 3. 更新 H5 前端
          find frontend/site -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf /tmp/tongban-h5.tar.gz -C frontend/site
          echo ">>> h5 OK"

          # 4. 构建并启动所有服务
          docker compose build backend
          docker compose up -d
          echo ">>> containers started"

          # 5. 显示容器状态
          docker compose ps
          echo "---"

          # 6. 健康检查：后端 API
          sleep 3
          if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
            echo "✅ backend API OK"
          else
            echo "❌ backend API failed"
            docker compose logs --tail=30 backend
            exit 1
          fi

          # 7. 健康检查：nginx + H5
          if curl -sf http://127.0.0.1/ > /dev/null; then
            echo "✅ nginx serving H5 OK"
          else
            echo "❌ nginx serving failed"
            docker compose logs --tail=30 nginx
            exit 1
          fi

          # 8. 健康检查：nginx 代理到后端
          if curl -sf http://127.0.0.1/api/health > /dev/null; then
            echo "✅ nginx -> backend proxy OK"
          else
            echo "❌ nginx -> backend proxy failed"
            exit 1
          fi

          # 9. 清理临时文件
          rm -f /tmp/tongban-backend.tar.gz /tmp/tongban-h5.tar.gz /tmp/tongban-infra.tar.gz

          echo ""
          echo "🎉 Tongban 部署成功！"
          REMOTE
