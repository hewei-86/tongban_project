services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tongban-backend
    restart: always
    environment:
      - DATABASE_URL=sqlite:////app/data/tongban.db
    volumes:
      - tongban-data:/app/data
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - tongban-net

  nginx:
    image: nginx:alpine
    container_name: tongban-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/site:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - tongban-net

networks:
  tongban-net:
    driver: bridge

volumes:
  tongban-data:
    driver: local
