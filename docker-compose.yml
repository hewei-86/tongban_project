services:
  mysql:
    image: mysql:8.0
    container_name: tongban-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tongban}
      MYSQL_USER: ${MYSQL_USER:-tongban}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    volumes:
      - tongban-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - tongban-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: tongban-backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-tongban}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-tongban}?charset=utf8mb4
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-turbo}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-*}
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tongban-net

  nginx:
    image: nginx:alpine
    container_name: tongban-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/site:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - tongban-net

networks:
  tongban-net:
    driver: bridge

volumes:
  tongban-mysql:
    driver: local
